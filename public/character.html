<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 角色扮演 | 角色互动</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Colors - Dark Nebula Theme */
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.6);
            --bg-input: rgba(15, 23, 42, 0.6);
            --bg-hover: rgba(255, 255, 255, 0.05);
            
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --secondary: #3b82f6;
            --accent: #f472b6;
            
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.1);
            
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --shadow-lg: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            
            /* Spacing */
            --radius-lg: 16px;
            --radius-md: 8px;
            --radius-sm: 4px;

            /* Character Chat Theme */
            --char-primary: #f472b6;
            --char-primary-hover: #ec4899;
            --char-bg: rgba(244, 114, 182, 0.1);
        }

        * { box-sizing: border-box; outline: none; }
        
        body {
            margin: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 114, 182, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* Layout */
        .app-container {
            display: flex;
            width: 100%;
            max-width: 1440px;
            height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: var(--glass-border);
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }
        .btn-icon:hover { color: var(--text-main); background: var(--bg-hover); }

        .presets-list {
            flex: 1;
            overflow-y: auto;
            margin: 0 -10px; /* Expand scroll area */
            padding: 0 10px;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .preset-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            group: 'preset';
        }
        .preset-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0; /* Fix flex overflow */
        }

        /* Config Panel */
        .config-panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 0 20px;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            cursor: pointer;
        }
        .config-title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .config-body {
            padding-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            border-top: var(--glass-border);
            padding-top: 20px;
        }
        .config-panel.collapsed .config-body { display: none; }
        .config-panel.collapsed .config-header { padding-bottom: 16px; }
        .config-panel.collapsed .rotate-icon { transform: rotate(-90deg); }

        /* Forms */
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        
        input, select, textarea {
            background: var(--bg-input);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.7; cursor: wait; }

        /* Chat Styles */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.1);
            height: 100%;
        }
        
        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-bottom-right-radius: 2px;
        }
        
        .message.ai {
            align-self: flex-start;
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }
        .message.ai.thinking { opacity: 0.6; font-style: italic; }

        .chat-input-wrapper {
            padding: 20px;
            background: var(--bg-card);
            border-top: var(--glass-border);
            display: flex;
            gap: 10px;
        }

        /* Utilities */
        .hidden { display: none !important; }
        .rotate-icon { transform: rotate(-90deg); }
        
    /* Toggle Switch */
    .switch {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: rgba(255,255,255,0.1);
        transition: .4s;
        border-radius: 18px;
    }
    .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 2px;
        bottom: 2px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(16px); }
        
        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
                padding: 10px;
                gap: 10px;
            }
            .sidebar {
                width: 100%;
                max-height: 200px;
            }
            .main-content {
                height: calc(100vh - 240px);
            }
        }

        /* Back to Home Button */
        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 10px 16px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .back-home:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        /* Character Item Styles — base layout; sticker look comes from character-paper.css */
        .character-item {
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .character-avatar {
            font-size: 26px;
        }
        .character-info {
            flex: 1;
            min-width: 0;
        }
        
        /* Debug Button */
        .debug-btn {
            margin-top: 8px;
            padding: 4px 12px;
            font-size: 11px;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            color: #a78bfa;
            cursor: pointer;
            transition: all 0.2s;
        }
        .debug-btn:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: rgba(139, 92, 246, 0.5);
        }
        
        /* Emotion Tag */
        .emotion-tag {
            display: inline-block;
            margin-top: 4px;
            padding: 2px 8px;
            font-size: 10px;
            background: rgba(244, 114, 182, 0.15);
            border-radius: 10px;
            color: #f472b6;
        }

        .chat-image-wrap {
            margin-top: 10px;
        }
        .chat-image {
            max-width: min(280px, 70%);
            border-radius: 12px;
            display: block;
            cursor: zoom-in;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .image-pending,
        .image-failed {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .image-pending {
            color: #a78bfa;
        }
        .image-failed {
            color: #f87171;
        }
        .image-lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1200;
            cursor: zoom-out;
            padding: 24px;
        }
        .image-lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 12px;
        }
        
        .timing-info {
            display: flex;
            gap: 8px;
            font-size: 10px;
            color: rgba(38, 34, 28, 0.55);
            margin-top: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        
        .timing-item {
            background: rgba(38, 34, 28, 0.06);
            color: rgba(38, 34, 28, 0.72);
            border: 1px solid rgba(38, 34, 28, 0.14);
            padding: 2px 6px;
            border-radius: 6px;
        }
        
        /* Debug Modal */
        .debug-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .debug-modal-content {
            background: var(--bg-dark);
            border: var(--glass-border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 900px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }
        .debug-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: var(--border);
        }
        .debug-modal-header h3 {
            margin: 0;
            color: var(--text-main);
        }
        .close-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-main);
        }
        .debug-modal-body {
            padding: 20px;
            max-height: calc(80vh - 60px);
            overflow-y: auto;
        }
        .debug-section {
            margin-bottom: 20px;
        }
        .debug-section:last-child {
            margin-bottom: 0;
        }
        .debug-section h4 {
            margin: 0 0 8px 0;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }
        .debug-section pre {
            margin: 0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-md);
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }

        /* Character Modal Styles */
        .character-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .character-modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .character-modal {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(139, 92, 246, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .character-modal-overlay.show .character-modal {
            transform: translateY(0) scale(1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 28px 32px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: linear-gradient(180deg, rgba(139, 92, 246, 0.08), transparent);
        }
        
        .modal-title-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .modal-icon {
            font-size: 36px;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(59, 130, 246, 0.1));
            border-radius: 16px;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        
        .modal-title {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f1f5f9, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }
        
        .modal-subtitle {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }
        
        .modal-close-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .modal-close-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
            transform: rotate(90deg);
        }
        
        .modal-body {
            padding: 32px;
            max-height: calc(90vh - 180px);
            overflow-y: auto;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 32px;
        }
        
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(59, 130, 246, 0.1));
            border: 2px solid rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .avatar-preview:hover {
            border-color: rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.3);
        }
        
        .avatar-emoji {
            font-size: 56px;
            transition: transform 0.3s;
        }
        
        .avatar-preview:hover .avatar-emoji {
            transform: scale(1.1);
        }
        
        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .avatar-preview:hover .avatar-overlay {
            opacity: 1;
        }
        
        .upload-icon {
            font-size: 24px;
        }
        
        .upload-text {
            font-size: 11px;
            color: white;
            font-weight: 600;
        }
        
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-group.full {
            grid-column: 1 / -1;
        }
        
        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .label-icon {
            font-size: 14px;
        }
        
        .label-hint {
            text-transform: none;
            font-weight: 400;
            font-size: 11px;
            color: rgba(148, 163, 184, 0.6);
            margin-left: auto;
        }
        
        .form-input, .form-textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
            width: 100%;
        }
        
        .form-input:focus, .form-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
            outline: none;
        }
        
        .form-input::placeholder, .form-textarea::placeholder {
            color: rgba(148, 163, 184, 0.4);
        }
        
        .form-textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }
        
        .modal-footer {
            padding: 24px 32px 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        
        .btn-secondary {
            padding: 12px 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .btn-primary-gradient {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px -3px rgba(139, 92, 246, 0.4);
        }
        
        .btn-primary-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -5px rgba(139, 92, 246, 0.5);
        }
        
        .btn-primary-gradient:active {
            transform: translateY(0);
        }
        
        .btn-arrow {
            font-size: 16px;
            transition: transform 0.2s;
        }
        
        .btn-primary-gradient:hover .btn-arrow {
            transform: translateX(4px);
        }
    </style>
    <link rel="stylesheet" href="styles/character-paper.css?v=6">
</head>
<body>

<a href="index.html" class="back-home">
    <span>🏠</span>
    <span>返回主页</span>
</a>

<div class="app-container">
    <aside class="sidebar sticker tilt-l">
        <div class="tape"></div>
        <div class="brand">
            <span class="kicker">角色本</span>
            <span class="brand-title">角色选择</span>
        </div>
        <div class="sidebar-header">
            <span class="sidebar-title">我的角色</span>
            <button class="btn-icon" onclick="createNewCharacter()" title="添加新角色">➕ 新建</button>
        </div>
        <div id="charactersList" class="presets-list">
            <div style="text-align:center; color:var(--text-muted); padding:20px; font-size:12px;">
                加载中...
            </div>
        </div>
        <div class="ticket">CHARACTER · STICKER SHEET</div>
    </aside>

    <main class="main-content chat-main sticker">
        <div class="tape warm"></div>
        <div class="chat-topbar chat-topbar-slim">
            <div class="chat-topbar-left" hidden aria-hidden="true">
                <span id="currentCharAvatar" class="chat-avatar">🎭</span>
                <div class="chat-topbar-text">
                    <div id="currentCharName" class="chat-name">选择角色</div>
                    <div id="currentCharDesc" class="chat-desc">与喜欢的角色互动吧</div>
                    <div id="currentCharBase" class="chat-base"></div>
                </div>
            </div>
            <div class="chat-topbar-actions">
                <button class="btn-icon" onclick="editCurrentCharacter()" title="编辑角色">✎</button>
                <button class="btn-icon" onclick="clearCurrentChat()" title="清空对话">🗑️</button>
                <button class="btn-icon" onclick="toggleSystemPrompt()" title="查看原始提示词">📝</button>
            </div>
        </div>
        <div class="chat-section" style="flex: 1; min-height: 0; background: var(--bg-card); backdrop-filter: blur(12px); border: var(--glass-border); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden;">
            <div class="chat-container" style="height: 100%;">
                <div id="charChatHistory" class="chat-history">
                    <div class="message ai" style="text-align: center; color: var(--text-muted);">
                        请选择左侧的角色开始对话
                    </div>
                </div>
                
                <div class="chat-input-wrapper">
                    <textarea id="charChatInput" placeholder="输入消息开始对话..." style="flex: 1; height: 60px; resize: none;"></textarea>
                    <button class="btn-primary" onclick="sendCharacterMessage()" style="padding: 0 24px;">
                        <span>🚀</span>
                        <span>发送</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <aside class="settings-panel sticker" id="characterInfoPanel">
        <div class="tape"></div>
        <div class="settings-header">
            <h2>配置贴纸</h2>
            <span class="kicker kicker-sm">AI + Comfy</span>
        </div>
        <div class="settings-scroll config-body" id="settingsScroll">
            
                <!-- Model Selection -->
                <div class="form-group">
                    <label>AI Provider</label>
                    <select id="provider" onchange="toggleProviderSettings()">
                        <option value="doubao">Doubao (火山引擎)</option>
                        <option value="ollama">Local Ollama</option>
                        <option value="deepseek" selected>DeepSeek</option>
                        <option value="openai">OpenAI / Compatible</option>
                    </select>
                </div>

                <!-- Doubao Specific -->
                <div id="doubaoInfo" class="form-group">
                    <label>Doubao Model</label>
                    <select id="doubaoModel">
                        <option value="deepseek-v4-flash-260425">DeepSeek v4 Flash (火山引擎)</option>
                        <option value="doubao-seed-2-0-mini-260428">Doubao Seed 2.0 Mini</option>
                        <option value="doubao-seed-2-0-lite-260428">Doubao Seed 2.0 Lite</option>
                        <option value="2.0" selected>Doubao 2.0 Pro</option>
                        <option value="1.8">Doubao 1.8 Pro</option>
                        <option value="1.6">Doubao 1.6 Flash (Vision Support)</option>
                    </select>
                </div>

                <!-- Generic Settings -->
                <div id="genericSettings" class="hidden" style="display: contents;">
                    <div class="form-group" style="flex: 2;">
                        <label>Base URL</label>
                        <input type="text" id="baseUrl" value="https://api.deepseek.com">
                    </div>
                    
                    <div class="form-group" style="flex: 1;">
                        <div style="display: flex; justify-content: space-between;">
                            <label>Model Name</label>
                            <span id="refreshModelsBtn" class="hidden" onclick="fetchOllamaModels(true)" style="cursor: pointer; font-size: 10px; color: var(--primary);">🔄 Refresh</span>
                        </div>
                        <div id="modelInputContainer">
                            <input type="text" id="model" value="deepseek-v4-flash">
                        </div>
                    </div>
                    
                    <div class="form-group" id="apiKeyGroup">
                        <label>API Key</label>
                        <input type="password" id="apiKey" placeholder="sk-...">
                    </div>
                </div>

                <div class="form-group wf-full">
                    <label style="display:flex; justify-content:space-between; align-items:center;">
                        <span>Comfy 出图参数 / Workflow</span>
                        <span style="display:flex; gap:10px;">
                            <span onclick="resetWorkflowSettings()" style="cursor:pointer; font-size:11px; color:var(--primary);">恢复默认</span>
                            <span onclick="loadWorkflowOptions(true)" style="cursor:pointer; font-size:11px; color:var(--primary);">刷新列表</span>
                        </span>
                    </label>
                    <div class="wf-grid">
                        <div class="wf-full">
                            <label style="font-size:11px; color:var(--text-muted);">Checkpoint</label>
                            <select id="comfyCheckpoint" onchange="saveWorkflowSettings()"></select>
                        </div>
                        <div>
                            <label style="font-size:11px; color:var(--text-muted);">宽 Width</label>
                            <input type="number" id="wfWidth" value="544" min="64" step="8" onchange="saveWorkflowSettings()">
                        </div>
                        <div>
                            <label style="font-size:11px; color:var(--text-muted);">高 Height</label>
                            <input type="number" id="wfHeight" value="960" min="64" step="8" onchange="saveWorkflowSettings()">
                        </div>
                        <div>
                            <label style="font-size:11px; color:var(--text-muted);">Steps</label>
                            <input type="number" id="wfSteps" value="30" min="1" max="150" onchange="saveWorkflowSettings()">
                        </div>
                        <div>
                            <label style="font-size:11px; color:var(--text-muted);">CFG</label>
                            <input type="number" id="wfCfg" value="3" min="0" max="30" step="0.1" onchange="saveWorkflowSettings()">
                        </div>
                        <div>
                            <label style="font-size:11px; color:var(--text-muted);">Sampler</label>
                            <select id="wfSampler" onchange="saveWorkflowSettings()"></select>
                        </div>
                        <div>
                            <label style="font-size:11px; color:var(--text-muted);">Scheduler</label>
                            <select id="wfScheduler" onchange="saveWorkflowSettings()"></select>
                        </div>
                        <div>
                            <label style="font-size:11px; color:var(--text-muted);">Denoise</label>
                            <input type="number" id="wfDenoise" value="1" min="0" max="1" step="0.01" onchange="saveWorkflowSettings()">
                        </div>
                        <div>
                            <label style="font-size:11px; color:var(--text-muted);">Seed（-1 随机）</label>
                            <input type="number" id="wfSeed" value="-1" onchange="saveWorkflowSettings()">
                        </div>
                        <div class="wf-full wf-check-row">
                            <input type="checkbox" id="wfEnableHires" onchange="saveWorkflowSettings(); toggleHiresFields()">
                            <label for="wfEnableHires" style="margin:0;">开启高清修复 / Hires</label>
                        </div>
                        <div id="hiresFields" class="wf-grid wf-full" style="display:none;">
                            <div>
                                <label style="font-size:11px; color:var(--text-muted);">Hires 宽</label>
                                <input type="number" id="wfHiresWidth" value="1080" min="64" step="8" onchange="saveWorkflowSettings()">
                            </div>
                            <div>
                                <label style="font-size:11px; color:var(--text-muted);">Hires 高</label>
                                <input type="number" id="wfHiresHeight" value="1920" min="64" step="8" onchange="saveWorkflowSettings()">
                            </div>
                            <div>
                                <label style="font-size:11px; color:var(--text-muted);">Hires Denoise</label>
                                <input type="number" id="wfHiresDenoise" value="0.4" min="0" max="1" step="0.01" onchange="saveWorkflowSettings()">
                            </div>
                            <div>
                                <label style="font-size:11px; color:var(--text-muted);">Hires Steps</label>
                                <input type="number" id="wfHiresSteps" value="20" min="1" max="150" onchange="saveWorkflowSettings()">
                            </div>
                        </div>
                        <div class="wf-full">
                            <label style="font-size:11px; color:var(--text-muted);">LoRA 1（对比度）</label>
                            <div class="wf-lora-row">
                                <select id="wfLora1Name" onchange="saveWorkflowSettings()"></select>
                                <input type="number" id="wfLora1Model" value="0.6" min="0" max="2" step="0.05" title="model strength" onchange="saveWorkflowSettings()">
                                <input type="number" id="wfLora1Clip" value="1" min="0" max="2" step="0.05" title="clip strength" onchange="saveWorkflowSettings()">
                            </div>
                        </div>
                        <div class="wf-full">
                            <label style="font-size:11px; color:var(--text-muted);">LoRA 2（饱和度）</label>
                            <div class="wf-lora-row">
                                <select id="wfLora2Name" onchange="saveWorkflowSettings()"></select>
                                <input type="number" id="wfLora2Model" value="0.5" min="0" max="2" step="0.05" onchange="saveWorkflowSettings()">
                                <input type="number" id="wfLora2Clip" value="1" min="0" max="2" step="0.05" onchange="saveWorkflowSettings()">
                            </div>
                        </div>
                        <div class="wf-full">
                            <label style="font-size:11px; color:var(--text-muted);">LoRA 3（画风）</label>
                            <div class="wf-lora-row">
                                <select id="wfLora3Name" onchange="saveWorkflowSettings()"></select>
                                <input type="number" id="wfLora3Model" value="0.5" min="0" max="2" step="0.05" onchange="saveWorkflowSettings()">
                                <input type="number" id="wfLora3Clip" value="1" min="0" max="2" step="0.05" onchange="saveWorkflowSettings()">
                            </div>
                            <div style="font-size:10px; color:var(--text-muted); margin-top:4px;">两列数字分别是 Model 强度 / CLIP 强度；选 (none) 或强度 0 等于关掉</div>
                        </div>
                        <div class="wf-full">
                            <label style="font-size:11px; color:var(--text-muted);">负向提示词</label>
                            <textarea id="wfNegative" style="height:72px; resize:vertical;" onchange="saveWorkflowSettings()"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Force Prompt -->
                <div class="form-group wf-full">
                    <label>强制提示词 / Force Prompt</label>
                    <textarea id="forcePrompt" placeholder="输入强制提示词，例如：我是和泉纱雾最信任的人" style="height: 80px; resize: vertical;"></textarea>
                    <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
                        强制提示词会覆盖角色的部分设定，让AI按照你的要求回应
                    </div>
                </div>

                <!-- System Prompt -->
                <div id="systemPromptSection" class="form-group hidden wf-full">
                    <label>角色原始提示词 / Original System Prompt</label>
                    <textarea id="currentSystemPrompt" readonly style="height: 120px; resize: vertical; background: rgba(0,0,0,0.2); color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 12px;"></textarea>
                    <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
                        这是角色的原始设定提示词，修改需要编辑角色
                    </div>
                </div>
            
            <div class="ticket">CFG · LORA · WORKFLOW</div>
        </div>
    </aside>
</div>

<script>
    // --- Global State ---
    let characters = [];
    let currentCharacter = null;
    let characterChatMessages = [];
    let emotionHistory = [];
    let conversationSummary = '';
    let lastVisualCache = null; // session cache so outfit/scene continuity does not wait for Comfy

    function rememberVisual(visual) {
        if (!visual) return;
        if (typeof visual === 'string' && visual.trim()) {
            lastVisualCache = { prompt: visual.trim() };
            return;
        }
        if (visual.prompt || visual.outfit || visual.scene || visual.action || visual.expression) {
            lastVisualCache = visual;
        }
    }

    function getLastVisualContext() {
        for (let i = characterChatMessages.length - 1; i >= 0; i--) {
            const msg = characterChatMessages[i];
            if (msg.role !== 'assistant') continue;
            if (msg.visual && (msg.visual.prompt || msg.visual.outfit || msg.visual.scene || msg.visual.action)) {
                rememberVisual(msg.visual);
                return msg.visual;
            }
            if (msg.imageTurnPrompt) {
                const v = { prompt: msg.imageTurnPrompt };
                rememberVisual(v);
                return v;
            }
        }
        return lastVisualCache;
    }

    function makeMessageId() {
        return 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    }

    function openChatImage(url) {
        const box = document.createElement('div');
        box.className = 'image-lightbox';
        box.innerHTML = `<img src="${escapeHtml(url)}" alt="character">`;
        box.addEventListener('click', () => box.remove());
        document.body.appendChild(box);
    }

    // --- Utilities ---
    function copyText(btn, text) {
        navigator.clipboard.writeText(text).then(() => {
            const original = btn.innerText;
            btn.innerText = '✅ Copied!';
            setTimeout(() => btn.innerText = original, 2000);
        });
    }
    
    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
        loadCharacters();
        toggleProviderSettings();
        loadWorkflowOptions();
        
        // Setup Character Chat Enter Key
        document.getElementById('charChatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendCharacterMessage();
            }
        });
    });

    // --- Model Settings ---
    function toggleProviderSettings() {
        const provider = document.getElementById('provider').value;
        const doubaoInfo = document.getElementById('doubaoInfo');
        const genericSettings = document.getElementById('genericSettings');
        const refreshBtn = document.getElementById('refreshModelsBtn');
        const apiKeyGroup = document.getElementById('apiKeyGroup');
        const baseUrl = document.getElementById('baseUrl');

        if (provider === 'doubao') {
            doubaoInfo.classList.remove('hidden');
            genericSettings.classList.add('hidden');
            genericSettings.style.display = 'none';
        } else {
            doubaoInfo.classList.add('hidden');
            genericSettings.classList.remove('hidden');
            genericSettings.style.display = 'contents';
            
            if (provider === 'ollama') {
                apiKeyGroup.classList.add('hidden');
                refreshBtn.classList.remove('hidden');
                if(baseUrl.value.includes('api.openai.com')) baseUrl.value = 'http://localhost:11434';
                fetchOllamaModels();
            } else if (provider === 'deepseek') {
                apiKeyGroup.classList.add('hidden');
                refreshBtn.classList.add('hidden');
                baseUrl.value = 'https://api.deepseek.com';
                document.getElementById('modelInputContainer').innerHTML = 
                    '<input type="text" id="model" value="deepseek-v4-flash" style="width: 100%;">';
            } else {
                apiKeyGroup.classList.remove('hidden');
                refreshBtn.classList.add('hidden');
                baseUrl.value = 'https://api.openai.com/v1';
                renderModelInput('input');
            }
        }
    }

    function checkpointLabel(name) {
        const map = {
            'unholyDesireMixSinister_v70.safetensors': 'Unholy Desire Mix Sinister V70',
            'unholyDesireMixSinister_v50.safetensors': 'Unholy Desire Mix Sinister V50'
        };
        return map[name] || name;
    }

    let workflowDefaultsCache = null;

    function toggleHiresFields() {
        const on = document.getElementById('wfEnableHires')?.checked;
        const box = document.getElementById('hiresFields');
        if (box) box.style.display = on ? 'grid' : 'none';
    }

    function fillSelect(el, values, selected, labels) {
        if (!el) return;
        const opts = values.map((v) => {
            const label = (labels && labels[v]) || v;
            return `<option value="${escapeHtml(v)}"${v === selected ? ' selected' : ''}>${escapeHtml(label)}</option>`;
        }).join('');
        el.innerHTML = opts;
        if (selected) el.value = selected;
    }

    function readWorkflowSettingsFromForm() {
        const lora = (i) => ({
            name: document.getElementById(`wfLora${i}Name`)?.value || '',
            strengthModel: Number(document.getElementById(`wfLora${i}Model`)?.value),
            strengthClip: Number(document.getElementById(`wfLora${i}Clip`)?.value)
        });
        return {
            checkpointName: document.getElementById('comfyCheckpoint')?.value || '',
            width: Number(document.getElementById('wfWidth')?.value),
            height: Number(document.getElementById('wfHeight')?.value),
            steps: Number(document.getElementById('wfSteps')?.value),
            cfg: Number(document.getElementById('wfCfg')?.value),
            sampler: document.getElementById('wfSampler')?.value || '',
            scheduler: document.getElementById('wfScheduler')?.value || '',
            denoise: Number(document.getElementById('wfDenoise')?.value),
            seed: Number(document.getElementById('wfSeed')?.value),
            enableHires: Boolean(document.getElementById('wfEnableHires')?.checked),
            hiresWidth: Number(document.getElementById('wfHiresWidth')?.value),
            hiresHeight: Number(document.getElementById('wfHiresHeight')?.value),
            hiresDenoise: Number(document.getElementById('wfHiresDenoise')?.value),
            hiresSteps: Number(document.getElementById('wfHiresSteps')?.value),
            negativePrompt: document.getElementById('wfNegative')?.value || '',
            loras: [lora(1), lora(2), lora(3)]
        };
    }

    function applyWorkflowSettingsToForm(settings, options = {}) {
        if (!settings) return;
        const setVal = (id, v) => {
            const el = document.getElementById(id);
            if (el != null && v != null) el.value = v;
        };
        if (options.checkpoints) {
            fillSelect(
                document.getElementById('comfyCheckpoint'),
                options.checkpoints,
                settings.checkpointName,
                Object.fromEntries(options.checkpoints.map((n) => [n, checkpointLabel(n)]))
            );
        } else {
            setVal('comfyCheckpoint', settings.checkpointName);
        }
        if (options.samplerOptions) {
            fillSelect(document.getElementById('wfSampler'), options.samplerOptions, settings.sampler);
        } else {
            setVal('wfSampler', settings.sampler);
        }
        if (options.schedulerOptions) {
            fillSelect(document.getElementById('wfScheduler'), options.schedulerOptions, settings.scheduler);
        } else {
            setVal('wfScheduler', settings.scheduler);
        }
        const loraNames = ['(none)', ...((options.loras || []).filter(Boolean))];
        for (let i = 1; i <= 3; i++) {
            const lora = (settings.loras && settings.loras[i - 1]) || {};
            const names = loraNames.includes(lora.name) || !lora.name ? loraNames : [lora.name, ...loraNames];
            fillSelect(document.getElementById(`wfLora${i}Name`), names, lora.name || '(none)');
            setVal(`wfLora${i}Model`, lora.strengthModel);
            setVal(`wfLora${i}Clip`, lora.strengthClip);
        }
        setVal('wfWidth', settings.width);
        setVal('wfHeight', settings.height);
        setVal('wfSteps', settings.steps);
        setVal('wfCfg', settings.cfg);
        setVal('wfDenoise', settings.denoise);
        setVal('wfSeed', settings.seed);
        const hires = document.getElementById('wfEnableHires');
        if (hires) hires.checked = Boolean(settings.enableHires);
        setVal('wfHiresWidth', settings.hiresWidth);
        setVal('wfHiresHeight', settings.hiresHeight);
        setVal('wfHiresDenoise', settings.hiresDenoise);
        setVal('wfHiresSteps', settings.hiresSteps);
        setVal('wfNegative', settings.negativePrompt);
        toggleHiresFields();
    }

    function saveWorkflowSettings() {
        try {
            localStorage.setItem('comfyWorkflowSettings', JSON.stringify(readWorkflowSettingsFromForm()));
            localStorage.setItem('comfyCheckpoint', document.getElementById('comfyCheckpoint')?.value || '');
        } catch (e) {}
    }

    function loadSavedWorkflowSettings() {
        try {
            const raw = localStorage.getItem('comfyWorkflowSettings');
            return raw ? JSON.parse(raw) : null;
        } catch (e) {
            return null;
        }
    }

    async function loadWorkflowOptions(isManual = false) {
        try {
            const res = await fetch('/api/comfy/workflow-options');
            const data = await res.json();
            workflowDefaultsCache = data.defaults || null;
            const saved = loadSavedWorkflowSettings();
            const merged = { ...(data.defaults || {}), ...(saved || {}) };
            if (!merged.checkpointName && saved?.checkpointName) merged.checkpointName = saved.checkpointName;
            if (!merged.checkpointName) {
                try { merged.checkpointName = localStorage.getItem('comfyCheckpoint') || data.defaults?.checkpointName; } catch (e) {}
            }
            applyWorkflowSettingsToForm(merged, {
                checkpoints: data.checkpoints || [merged.checkpointName],
                loras: data.loras || [],
                samplerOptions: data.defaults?.samplerOptions || [],
                schedulerOptions: data.defaults?.schedulerOptions || []
            });
            saveWorkflowSettings();
            if (isManual) alert('出图参数列表已刷新');
        } catch (e) {
            console.error(e);
            if (isManual) alert('刷新失败：' + e.message);
        }
    }

    function resetWorkflowSettings() {
        if (!workflowDefaultsCache) {
            loadWorkflowOptions(true);
            return;
        }
        applyWorkflowSettingsToForm(workflowDefaultsCache, {
            checkpoints: Array.from(document.getElementById('comfyCheckpoint')?.options || []).map((o) => o.value),
            loras: Array.from(document.getElementById('wfLora1Name')?.options || []).map((o) => o.value).filter((v) => v !== '(none)'),
            samplerOptions: workflowDefaultsCache.samplerOptions || [],
            schedulerOptions: workflowDefaultsCache.schedulerOptions || []
        });
        saveWorkflowSettings();
    }

    function getSelectedCheckpoint() {
        return document.getElementById('comfyCheckpoint')?.value || 'unholyDesireMixSinister_v70.safetensors';
    }

    function getWorkflowSettings() {
        return readWorkflowSettingsFromForm();
    }

    async function fetchOllamaModels(isManual = false) {
        const provider = document.getElementById('provider').value;
        if (provider !== 'ollama') return;

        const baseUrl = document.getElementById('baseUrl').value;
        const btn = document.getElementById('refreshModelsBtn');
        
        if (isManual) btn.innerText = '...';

        try {
            const res = await fetch(`/api/models?baseUrl=${encodeURIComponent(baseUrl)}`);
            const data = await res.json();
            
            if (data.models && data.models.length > 0) {
                renderModelInput('select', data.models);
                if (isManual) alert(`Found ${data.models.length} models`);
            } else {
                renderModelInput('input');
                if (isManual) alert('No models found. Check Ollama connection.');
            }
        } catch (e) {
            console.error(e);
            renderModelInput('input');
        } finally {
            if (isManual) btn.innerText = '🔄 Refresh';
        }
    }

    function renderModelInput(type, models = [], defaultValue = '') {
        const container = document.getElementById('modelInputContainer');
        const currentVal = document.getElementById('model') ? document.getElementById('model').value : '';
        const value = currentVal || defaultValue;
        
        if (type === 'select') {
            const options = models.map(m => `<option value="${m}" ${m === value ? 'selected' : ''}>${m}</option>`).join('');
            container.innerHTML = `<select id="model" style="width: 100%;">${options}</select>`;
        } else {

    async function selectCharacter(characterId) {
        currentCharacter = characters.find(c => c.id === characterId);
        if (!currentCharacter) return;
        
        // Update UI
        document.getElementById('currentCharAvatar').innerHTML = currentCharacter.avatar.includes('http') ? 
            `<img src="${currentCharacter.avatar}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">` :

        document.getElementById('currentCharDesc').innerText = currentCharacter.description;
        const baseEl = document.getElementById('currentCharBase');
        if (baseEl) {
            const baseBits = [currentCharacter.appearancePrompt, currentCharacter.outfitPrompt].filter(Boolean);
            baseEl.innerText = baseBits.length ? ('底模：' + baseBits.join(' / ')) : '底模未设置，请编辑角色并填写特征提示词';
        }
        
        // Update system prompt display
        document.getElementById('currentSystemPrompt').value = currentCharacter.systemPrompt;
        
        // Load chat history
        try {
            const res = await fetch(`/api/chat-history/${characterId}`);
            const historyData = await res.json();
            characterChatMessages = historyData.messages || [];
            emotionHistory = historyData.emotionHistory || [];
            conversationSummary = historyData.summary || '';
            lastVisualCache = null;
            getLastVisualContext(); // warm cache from loaded history
        } catch (e) {
            characterChatMessages = [];
            emotionHistory = [];
            conversationSummary = '';
        }
        
        // Render chat
        renderCharacterChat();
        renderCharactersList(); // Update selection highlight
        
        // Scroll to bottom
        setTimeout(() => {
            const history = document.getElementById('charChatHistory');
            history.scrollTop = history.scrollHeight;
        }, 100);
    }
    
    function renderCharacterChat() {
        const history = document.getElementById('charChatHistory');
        
        if (characterChatMessages.length === 0) {
            history.innerHTML = `
                <div class="message ai" style="text-align: center;">
                    <div style="font-size: 48px; margin-bottom: 12px;">${currentCharacter.avatar}</div>
                    <div style="font-weight: 600; margin-bottom: 8px;">${currentCharacter.name}</div>
                    <div style="font-size: 13px; color: var(--text-muted); max-width: 400px; margin: 0 auto; line-height: 1.6;">
                        ${currentCharacter.description}<br>
                        性格：${currentCharacter.personality}<br><br>
                        开始对话吧！✨
                    </div>
                </div>
            `;
            return;
        }
        
        history.innerHTML = characterChatMessages.map((msg, index) => {
            if (msg.role === 'user') {
                return `<div class="message user">${escapeHtml(msg.content).replace(/\n/g, '<br>')}</div>`;
            } else {
                const hasDebugInfo = msg.debugInfo;
                const emotion = msg.emotionAnalysis?.emotionAnalysis || msg.emotionAnalysis;
                let imageBlock = '';
                if (msg.imageStatus === 'pending') {
                    imageBlock = `<div class="image-pending">正在绘制这一幕…</div>`;
                } else if (msg.imageStatus === 'failed') {
                    imageBlock = `<div class="image-failed">配图失败${msg.imageError ? '：' + escapeHtml(msg.imageError) : ''}</div>`;
                } else if (msg.imageUrl) {
                    imageBlock = `<div class="chat-image-wrap"><img class="chat-image" src="${escapeHtml(msg.imageUrl)}" alt="" onclick="openChatImage('${escapeHtml(msg.imageUrl)}')"></div>`;
                }
                return `
                    <div class="message ai">
                        ${escapeHtml(msg.content).replace(/\n/g, '<br>')}
                        ${imageBlock}
                        ${hasDebugInfo ? `<button class="debug-btn" onclick="showDebugInfo(${index})">查询日志</button>` : ''}
                        ${emotion && emotion.primaryEmotion ? `<div class="emotion-tag">${emotion.primaryEmotion} ${emotion.intensity || 0}/10</div>` : ''}
                        ${msg.visual ? `<div class="emotion-tag">出图：${escapeHtml(msg.visual.prompt || [msg.visual.expression, msg.visual.action, msg.visual.outfit, msg.visual.scene].filter(Boolean).join(' · '))}</div>` : ''}
                        ${msg.timing ? `
                        <div class="timing-info">
                            <span class="timing-item">情感: ${(msg.timing.emotionTimeMs / 1000).toFixed(1)}s</span>
                            <span class="timing-item">回复: ${(msg.timing.replyTimeMs / 1000).toFixed(1)}s</span>
                            <span class="timing-item">总耗时: ${(msg.timing.totalTimeMs / 1000).toFixed(1)}s</span>
                        </div>
                        ` : ''}
                    </div>
                `;
            }
        }).join('');
        
        history.scrollTop = history.scrollHeight;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    async function sendCharacterMessage() {
        if (!currentCharacter) {
            alert('请先选择角色');
            return;
        }
        
        const input = document.getElementById('charChatInput');
        const text = input.value.trim();
        if (!text) return;
        
        // Add user message
        characterChatMessages.push({ role: 'user', content: text, id: makeMessageId() });
        renderCharacterChat();
        input.value = '';
        
        // Show thinking
        const thinkingId = 'thinking-' + Date.now();
        const history = document.getElementById('charChatHistory');
        const thinkingDiv = document.createElement('div');
        thinkingDiv.className = 'message ai thinking';
        thinkingDiv.id = thinkingId;
        thinkingDiv.innerText = currentCharacter.name + '正在思考...';
        history.appendChild(thinkingDiv);
        history.scrollTop = history.scrollHeight;
        
        // Get force prompt
        const forcePrompt = document.getElementById('forcePrompt').value.trim();
        
        // Prepare system prompt with force prompt
        let systemPrompt = currentCharacter.systemPrompt;
        if (forcePrompt) {
            systemPrompt = `${systemPrompt}\n\n**强制提示词**：${forcePrompt}`;
        }
        
        // Get provider settings
        const provider = document.getElementById('provider').value;
        let model = document.getElementById('model') ? document.getElementById('model').value : '';
        if (provider === 'doubao') model = document.getElementById('doubaoModel').value;
        
        // 使用带情绪分析的聊天接口
        const messagesForAI = characterChatMessages.map(m => ({
            role: m.role,
            content: m.content
        }));
        const previousVisual = getLastVisualContext();
        const payload = {
            messages: messagesForAI,
            systemPrompt: systemPrompt,
            provider,
            model,
            baseUrl: document.getElementById('baseUrl').value,
            apiKey: document.getElementById('apiKey').value,
            conversationSummary: conversationSummary,
            appearancePrompt: currentCharacter.appearancePrompt || '',
            outfitPrompt: currentCharacter.outfitPrompt || '',
            previousVisual
        };
        
        try {
            const res = await fetch('/api/chat-with-emotion', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            document.getElementById(thinkingId).remove();
            
            if (data.error) throw new Error(data.error);
            
            // 保存调试信息
            const debugInfo = data.debugInfo || {};
            
            const assistantId = makeMessageId();
            const emotionBlock = data.emotionAnalysis?.emotionAnalysis || data.emotionAnalysis || {};
            const turnPromptFromChat = (data.visual && data.visual.prompt) ? data.visual.prompt : '';
            rememberVisual(data.visual);
            characterChatMessages.push({ 
                id: assistantId,
                role: 'assistant', 
                content: data.reply,
                debugInfo: debugInfo,
                emotionAnalysis: data.emotionAnalysis,
                visual: data.visual || null,
                imageTurnPrompt: turnPromptFromChat,
                timing: data.timing,
                imageStatus: 'pending'
            });
            console.log('[continuity] previousVisual sent:', previousVisual);
            console.log('[continuity] new visual cached:', data.visual || turnPromptFromChat || '(none)');
            
            // 保存情绪分析结果到历史
            if (data.emotionAnalysis) {
                emotionHistory.push({
                    timestamp: Date.now(),
                    ...data.emotionAnalysis
                });
            }
            
            // 更新对话摘要
            if (data.newSummary) {
                conversationSummary = data.newSummary;
            }
            
            renderCharacterChat();
            await saveChatHistory();
            requestCharacterImage(assistantId, emotionBlock, data.reply, data.visual, previousVisual);
            
        } catch (e) {
            const thinking = document.getElementById(thinkingId);
            if (thinking) {
                thinking.innerText = 'Error: ' + e.message;
                thinking.style.color = '#ef4444';
                thinking.classList.remove('thinking');
            }
        }
    }
    
    async function saveChatHistory() {
        if (!currentCharacter) return;
        try {
            await fetch(`/api/chat-history/${currentCharacter.id}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    messages: characterChatMessages,
                    emotionHistory: emotionHistory,
                    summary: conversationSummary
                })
            });
        } catch (e) {
            console.error('Failed to save chat history', e);
        }
    }

    async function requestCharacterImage(messageId, emotionBlock, reply, visual, previousVisual = null) {
        if (!currentCharacter) return;
        const provider = document.getElementById('provider').value;
        let model = document.getElementById('model') ? document.getElementById('model').value : '';
        if (provider === 'doubao') model = document.getElementById('doubaoModel').value;
        try {
            const res = await fetch('/api/character-image', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    characterId: currentCharacter.id,
                    emotion: emotionBlock.primaryEmotion || '平静',
                    intensity: emotionBlock.intensity,
                    replySnippet: reply,
                    visual: visual || null,
                    previousVisual: previousVisual || null,
                    provider,
                    model,
                    baseUrl: document.getElementById('baseUrl').value,
                    apiKey: document.getElementById('apiKey').value,
                    checkpointName: getSelectedCheckpoint(),
                    workflowSettings: getWorkflowSettings(),
                    messageId
                })
            });
            const data = await res.json();
            const msg = characterChatMessages.find(m => m.id === messageId);
            if (!msg) return;
            msg.imagePrompt = data.prompt || '';
            msg.imageTurnPrompt = data.turnPrompt || msg.imageTurnPrompt || '';
            msg.imageNegative = data.negative || '';
            if (data.checkpointName) msg.checkpointName = data.checkpointName;
            if (data.visual) {
                msg.visual = data.visual;
                rememberVisual(data.visual);
            } else if (msg.imageTurnPrompt) {
                rememberVisual({ prompt: msg.imageTurnPrompt });
            }
            if (data.ok && data.imageUrl) {
                msg.imageUrl = data.imageUrl;
                msg.imageStatus = 'ready';
                msg.imageError = '';
            } else {
                msg.imageStatus = 'failed';
                msg.imageError = data.error || '出图失败';
            }
            renderCharacterChat();
            await saveChatHistory();
        } catch (e) {
            const msg = characterChatMessages.find(m => m.id === messageId);
            if (!msg) return;
            msg.imageStatus = 'failed';
            msg.imageError = e.message;
            renderCharacterChat();
        }
    }

    }

            document.getElementById('charName').value = character.name || '';
            document.getElementById('charAvatar').value = character.avatar || '👤';
            document.getElementById('charDesc').value = character.description || '';
            document.getElementById('charPersonality').value = character.personality || '';
            document.getElementById('charSystemPrompt').value = character.systemPrompt || '';
            document.getElementById('charAppearancePrompt').value = character.appearancePrompt || '';
            document.getElementById('charOutfitPrompt').value = character.outfitPrompt || '';
            document.getElementById('modalSubmitBtn').innerHTML = '<span>保存更改</span><span class="btn-arrow">→</span>';
            document.getElementById('modalSubmitBtn').onclick = () => saveCharacterEdit(character.id);
        } else {
            document.getElementById('charAvatar').value = '👤';
            document.getElementById('avatarEmoji').textContent = '👤';
            document.getElementById('modalSubmitBtn').innerHTML = '<span>创建角色</span><span class="btn-arrow">→</span>';
            document.getElementById('modalSubmitBtn').onclick = saveNewCharacter;
        }
        
        // 添加事件监听器
        document.getElementById('avatarPreview').addEventListener('click', () => {
            document.getElementById('avatarFile').click();
        });
        
        document.getElementById('avatarFile').addEventListener('change', handleAvatarUpload);
    }
    
    function closeCharacterModal() {
        const modal = document.querySelector('.character-modal-overlay');
        if (modal) {
            modal.classList.remove('show');
            setTimeout(() => modal.remove(), 300);
        }
    }
    
    function updateAvatarPreview() {
        const emoji = document.getElementById('charAvatar').value || '👤';
        document.getElementById('avatarEmoji').textContent = emoji;
    }
    
    function handleAvatarUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
            const preview = document.getElementById('avatarPreview');
            const emoji = document.getElementById('avatarEmoji');
            emoji.style.display = 'none';
            preview.style.backgroundImage = `url(${event.target.result})`;
            preview.style.backgroundSize = 'cover';
            preview.style.backgroundPosition = 'center';
        };
        reader.readAsDataURL(file);
    }
    
    async function saveNewCharacter() {
        const name = document.getElementById('charName').value;
        const avatar = document.getElementById('charAvatar').value;
        const description = document.getElementById('charDesc').value;
        const personality = document.getElementById('charPersonality').value;
        const systemPrompt = document.getElementById('charSystemPrompt').value;
        const appearancePrompt = document.getElementById('charAppearancePrompt').value;
        const outfitPrompt = document.getElementById('charOutfitPrompt').value;
        const avatarFile = document.getElementById('avatarFile').files[0];
        
        if (!name || !systemPrompt) {
            alert('角色名称和设定提示词不能为空');
            return;
        }
        
        try {
            let avatarUrl = avatar || '👤';
            
            if (avatarFile) {
                const formData = new FormData();
                formData.append('avatar', avatarFile);
                
                const uploadRes = await fetch('/api/upload-avatar', {
                    method: 'POST',
                    body: formData
                });
                
                if (uploadRes.ok) {
                    const uploadData = await uploadRes.json();
                    avatarUrl = uploadData.avatarUrl;
                }
            }
            
            const res = await fetch('/api/characters', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name,
                    avatar: avatarUrl,
                    description: description || '',
                    personality: personality || '',
                    systemPrompt,
                    appearancePrompt: appearancePrompt || '',
                    outfitPrompt: outfitPrompt || ''
                })
            });
            const character = await res.json();
            characters.push(character);
            renderCharactersList();
            selectCharacter(character.id);
            closeCharacterModal();
        } catch (e) {
            alert('创建角色失败');
        }
    }
    
    async function editCharacter(e, characterId) {
        e.stopPropagation();
        const character = characters.find(c => c.id === characterId);
        if (!character) return;
        
        showCharacterModal(character);
    }
    
    async function saveCharacterEdit(characterId) {
        const name = document.getElementById('charName').value;
        const avatar = document.getElementById('charAvatar').value;
        const description = document.getElementById('charDesc').value;
        const personality = document.getElementById('charPersonality').value;
        const systemPrompt = document.getElementById('charSystemPrompt').value;
        const appearancePrompt = document.getElementById('charAppearancePrompt').value;
        const outfitPrompt = document.getElementById('charOutfitPrompt').value;
        const avatarFile = document.getElementById('avatarFile').files[0];
        
        if (!name || !systemPrompt) {
            alert('角色名称和设定提示词不能为空');
            return;
        }
        
        try {
            let avatarUrl = avatar;
            
            // Handle file upload if provided
            if (avatarFile) {
                const formData = new FormData();
                formData.append('avatar', avatarFile);
                formData.append('characterId', characterId);
                
                const uploadRes = await fetch('/api/upload-avatar', {
                    method: 'POST',
                    body: formData
                });
                
                if (uploadRes.ok) {
                    const uploadData = await uploadRes.json();
                    avatarUrl = uploadData.avatarUrl;
                }
            }
            
            await fetch('/api/characters', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    id: characterId,
                    name,
                    avatar: avatarUrl || '👤',
                    description: description || '',
                    personality: personality || '',
                    systemPrompt,
                    appearancePrompt: appearancePrompt || '',
                    outfitPrompt: outfitPrompt || ''
                })
            });
            
            // Update local data
            const index = characters.findIndex(c => c.id === characterId);
            if (index >= 0) {
                characters[index] = { ...characters[index], name, avatar: avatarUrl, description, personality, systemPrompt, appearancePrompt, outfitPrompt };
                if (currentCharacter && currentCharacter.id === characterId) {
                    currentCharacter = characters[index];
                    selectCharacter(characterId);
                } else {
                    renderCharactersList();
                }
            }
            
            closeCharacterModal();
        } catch (e) {
            alert('保存角色失败: ' + e.message);
        }
    }
    
    function editCurrentCharacter() {
        if (!currentCharacter) {
            alert('请先选择角色');
            return;
        }
        editCharacter({ stopPropagation: () => {} }, currentCharacter.id);
    }
    
    async function deleteCharacter(e, characterId) {
        e.stopPropagation();
        if (!confirm('确定删除这个角色吗？')) return;
        
        try {
            await fetch(`/api/characters/${characterId}`, { method: 'DELETE' });
            characters = characters.filter(c => c.id !== characterId);
            if (currentCharacter && currentCharacter.id === characterId) {
                currentCharacter = null;
                characterChatMessages = [];
                document.getElementById('charChatHistory').innerHTML = `
                    <div class="message ai" style="text-align: center; color: var(--text-muted);">
                        请选择左侧的角色开始对话
                    </div>
                `;
                document.getElementById('currentCharName').innerText = '选择角色';
                document.getElementById('currentCharDesc').innerText = '与喜欢的角色互动吧';
                const baseEl = document.getElementById('currentCharBase');
                if (baseEl) baseEl.innerText = '';
                document.getElementById('currentCharAvatar').innerText = '🎭';
            }
            renderCharactersList();
        } catch (e) {
            alert('删除角色失败');
        }
    }
</script>

</body>
