<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片边框 - 批量贴纸框</title>
    <link rel="stylesheet" href="styles/frame-paper.css?v=3">
</head>
<body>
    <a href="index.html" class="back-home">
        <span>🏠</span>
        <span>返回主页</span>
    </a>

    <div class="frame-app">
        <header class="frame-header">
            <h1>🖼️ 图片边框</h1>
            <p>选择多张图片，预览贴纸边框效果，批量导出到指定文件夹。每张图可单独填写底部文案。</p>
        </header>

        <div class="frame-layout">
            <!-- 左侧：上传与列表 -->
            <section class="frame-panel">
                <div class="frame-panel-head">
                    <span>图片列表</span>
                    <span id="fileCountLabel">0 张</span>
                </div>
                <div class="frame-panel-body">
                    <div class="upload-drop" id="uploadDrop">
                        <div class="upload-drop-icon">📁</div>
                        <div class="upload-drop-text">点击或拖拽添加图片</div>
                        <div class="upload-drop-hint">支持多选 · JPG / PNG / WebP</div>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" multiple>

                    <div class="file-toolbar">
                        <label><input type="checkbox" id="selectAllFiles" checked> 全选导出</label>
                        <button type="button" class="link-btn" id="clearAllBtn">清空列表</button>
                    </div>

                    <div class="file-list" id="fileList">
                        <div class="preview-empty">还没有图片，从文件夹选中后拖进来吧</div>
                    </div>
                </div>
            </section>

            <!-- 中间：预览 -->
            <section class="frame-panel preview-panel">
                <div class="frame-panel-head">
                    <span>效果预览</span>
                    <span id="previewFileName">—</span>
                </div>
                <div class="frame-panel-body">
                    <div class="preview-wrap" id="previewWrap">
                        <div class="preview-empty" id="previewEmpty">上传图片后在此预览加框效果</div>
                        <img id="previewImage" alt="" hidden>
                    </div>
                    <div class="preview-nav" id="previewNav" hidden>
                        <button type="button" id="prevPreviewBtn">◀ 上一张</button>
                        <span id="previewIndexLabel">1 / 1</span>
                        <button type="button" id="nextPreviewBtn">下一张 ▶</button>
                        <button type="button" id="rerenderPreviewBtn">重新渲染</button>
                    </div>
                </div>
            </section>

            <!-- 右侧：样式与导出 -->
            <section class="frame-panel">
                <div class="frame-panel-head">边框样式</div>
                <div class="frame-panel-body">
                    <div class="style-form" id="styleForm">
                        <div class="style-field full">
                            <label for="presetSelect">预设模板</label>
                            <select id="presetSelect">
                                <option value="paper-collage">贴纸剪贴 · paper-collage</option>
                                <option value="sketch-note">手绘线稿 · sketch-note</option>
                                <option value="apple-glass">苹果浅蓝玻璃 · apple-light-blue-glass</option>
                                <option value="apple-tech">科技发布会 · apple-tech-gradient</option>
                                <option value="editorial">杂志编辑 · editorial-magazine</option>
                                <option value="finance">财经演播室 · finance-studio-cards</option>
                                <option value="ink">墨蓝手稿 · ink-framework</option>
                                <option value="manifesto">宣言海报 · manifesto-poster</option>
                                <option value="newspaper">档案剪报 · newspaper-evidence</option>
                                <option value="chat">对话条同款</option>
                                <option value="polaroid">拍立得</option>
                                <option value="minimal">简约白边</option>
                            </select>
                        </div>

                        <div class="style-row">
                            <div class="style-field">
                                <label for="outputWidth">输出宽度 (px)</label>
                                <select id="outputWidth">
                                    <option value="0" selected>原图尺寸（不压缩）</option>
                                    <option value="390">390 小红书竖图</option>
                                    <option value="540">540 中等</option>
                                    <option value="1080">1080 高清</option>
                                </select>
                            </div>
                            <div class="style-field">
                                <label for="paddingRange">内边距 <span id="paddingVal">32</span>px</label>
                                <input type="range" id="paddingRange" min="8" max="64" step="2" value="32">
                            </div>
                        </div>

                        <div class="style-row">
                            <div class="style-field">
                                <label for="borderRadiusRange">圆角 <span id="radiusVal">12</span>px</label>
                                <input type="range" id="borderRadiusRange" min="0" max="32" step="1" value="12">
                            </div>
                            <div class="style-field">
                                <label for="shadowRange">阴影 <span id="shadowVal">3</span>px</label>
                                <input type="range" id="shadowRange" min="0" max="8" step="1" value="3">
                            </div>
                        </div>

                        <div class="checkbox-row">
                            <input type="checkbox" id="glassBgCheck" checked>
                            <label for="glassBgCheck">模糊原图作背景（磨砂玻璃）</label>
                        </div>

                        <div class="style-row" id="solidBgRow" hidden>
                            <div class="style-field">
                                <label for="bgColor">纯色背景</label>
                                <input type="color" id="bgColor" value="#f6edda">
                            </div>
                            <div class="style-field"></div>
                        </div>

                        <div class="style-row">
                            <div class="style-field full">
                                <label for="tiltRange">微旋转 <span id="tiltVal">-0.6</span>°</label>
                                <input type="range" id="tiltRange" min="-3" max="3" step="0.1" value="-0.6">
                            </div>
                        </div>

                        <div class="checkbox-row">
                            <input type="checkbox" id="tapeCheck" checked>
                            <label for="tapeCheck">显示角上胶带装饰</label>
                        </div>
                    </div>

                    <div class="export-section">
                        <label for="exportFolderPath">导出文件夹</label>
                        <div class="export-folder-row">
                            <input type="text" id="exportFolderPath" placeholder="点击选择或粘贴完整路径">
                            <button type="button" class="btn-secondary" id="pickFolderBtn">选择</button>
                        </div>
                        <p class="export-hint">推荐 Edge / Chrome 点「选择」直接写入文件夹（原图导出体积大，比粘贴路径更稳）</p>
                        <p class="export-progress" id="exportProgress"></p>
                        <button type="button" class="btn-primary" id="exportBtn" disabled>批量导出 PNG</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="js/sticker-frame.js?v=7"></script>
    <script>
        const EXPORT_FOLDER_KEY = 'frameExportFolderPath';
        let files = [];
        let previewIndex = 0;
        let exportDirHandle = null;
        let previewTimer = null;
        let previewObjectUrl = null;

        const els = {
            uploadDrop: document.getElementById('uploadDrop'),
            fileInput: document.getElementById('fileInput'),
            fileList: document.getElementById('fileList'),
            fileCountLabel: document.getElementById('fileCountLabel'),
            selectAllFiles: document.getElementById('selectAllFiles'),
            clearAllBtn: document.getElementById('clearAllBtn'),
            previewWrap: document.getElementById('previewWrap'),
            previewEmpty: document.getElementById('previewEmpty'),
            previewImage: document.getElementById('previewImage'),
            previewFileName: document.getElementById('previewFileName'),
            previewNav: document.getElementById('previewNav'),
            previewIndexLabel: document.getElementById('previewIndexLabel'),
            prevPreviewBtn: document.getElementById('prevPreviewBtn'),
            nextPreviewBtn: document.getElementById('nextPreviewBtn'),
            rerenderPreviewBtn: document.getElementById('rerenderPreviewBtn'),
            presetSelect: document.getElementById('presetSelect'),
            outputWidth: document.getElementById('outputWidth'),
            paddingRange: document.getElementById('paddingRange'),
            paddingVal: document.getElementById('paddingVal'),
            borderRadiusRange: document.getElementById('borderRadiusRange'),
            radiusVal: document.getElementById('radiusVal'),
            shadowRange: document.getElementById('shadowRange'),
            shadowVal: document.getElementById('shadowVal'),
            bgColor: document.getElementById('bgColor'),
            glassBgCheck: document.getElementById('glassBgCheck'),
            solidBgRow: document.getElementById('solidBgRow'),
            tiltRange: document.getElementById('tiltRange'),
            tiltVal: document.getElementById('tiltVal'),
            tapeCheck: document.getElementById('tapeCheck'),
            exportFolderPath: document.getElementById('exportFolderPath'),
            pickFolderBtn: document.getElementById('pickFolderBtn'),
            exportBtn: document.getElementById('exportBtn'),
            exportProgress: document.getElementById('exportProgress')
        };

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function syncSolidBgRowVisibility() {
            const useGlass = els.glassBgCheck.checked;
            els.solidBgRow.hidden = useGlass;
        }

        function readStyleOptions(caption = '', { forPreview = false } = {}) {
            const opts = {
                preset: els.presetSelect.value,
                padding: Number(els.paddingRange.value),
                bgColor: els.bgColor.value,
                glassBg: els.glassBgCheck.checked,
                borderRadius: Number(els.borderRadiusRange.value),
                shadowOffset: Number(els.shadowRange.value),
                tiltDeg: Number(els.tiltRange.value),
                tape: els.tapeCheck.checked,
                outputWidth: Number(els.outputWidth.value),
                caption
            };
            if (forPreview) {
                opts.previewMaxWidth = 960;
            }
            return opts;
        }

        function resolvePresetKey(key) {
            const aliases = { xhs: 'paper-collage' };
            return aliases[key] || key;
        }

        function applyPresetToForm(presetKey) {
            presetKey = resolvePresetKey(presetKey);
            const preset = StickerFrame.PRESETS[presetKey];
            if (!preset) return;
            els.paddingRange.value = preset.padding;
            els.paddingVal.textContent = preset.padding;
            els.borderRadiusRange.value = preset.borderRadius;
            els.radiusVal.textContent = preset.borderRadius;
            els.shadowRange.value = preset.shadowOffset ?? 0;
            els.shadowVal.textContent = preset.shadowOffset ?? 0;
            if (preset.bgColor) els.bgColor.value = preset.bgColor;
            els.glassBgCheck.checked = preset.glassBg !== false && preset.bgMode !== 'solid';
            els.tiltRange.value = preset.tiltDeg ?? 0;
            els.tiltVal.textContent = preset.tiltDeg ?? 0;
            els.tapeCheck.checked = Boolean(preset.tape);
            if (preset.outputWidth != null) {
                els.outputWidth.value = String(preset.outputWidth);
            }
            syncSolidBgRowVisibility();
        }

        function loadImageFromFile(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(img);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('图片加载失败'));
                };
                img.src = url;
            });
        }

        function updateExportButtonState() {
            const hasFiles = files.some((f) => f.selected);
            const hasFolder = Boolean(exportDirHandle || els.exportFolderPath.value.trim());
            els.exportBtn.disabled = !(hasFiles && hasFolder);
        }

        function renderFileList() {
            if (!files.length) {
                els.fileList.innerHTML = '<div class="preview-empty">还没有图片，从文件夹选中后拖进来吧</div>';
                els.fileCountLabel.textContent = '0 张';
                updateExportButtonState();
                return;
            }

            els.fileCountLabel.textContent = `${files.length} 张`;
            els.fileList.innerHTML = files.map((item, index) => `
                <div class="file-item${index === previewIndex ? ' active' : ''}" data-index="${index}">
                    <input type="checkbox" class="file-item-check" data-index="${index}" ${item.selected ? 'checked' : ''} onclick="event.stopPropagation()">
                    <img class="file-thumb" src="${item.thumbUrl}" alt="">
                    <div class="file-meta">
                        <div class="file-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
                        <input type="text" class="file-caption-input" data-index="${index}" placeholder="底部文案（可选）" value="${escapeHtml(item.caption)}" onclick="event.stopPropagation()">
                    </div>
                </div>
            `).join('');

            els.fileList.querySelectorAll('.file-item').forEach((row) => {
                row.addEventListener('click', () => {
                    previewIndex = Number(row.dataset.index);
                    renderFileList();
                    schedulePreview();
                });
            });

            els.fileList.querySelectorAll('.file-item-check').forEach((cb) => {
                cb.addEventListener('change', () => {
                    const idx = Number(cb.dataset.index);
                    files[idx].selected = cb.checked;
                    syncSelectAllCheckbox();
                    updateExportButtonState();
                });
            });

            els.fileList.querySelectorAll('.file-caption-input').forEach((input) => {
                input.addEventListener('input', () => {
                    const idx = Number(input.dataset.index);
                    files[idx].caption = input.value;
                    if (idx === previewIndex) schedulePreview();
                });
            });

            updateExportButtonState();
        }

        function syncSelectAllCheckbox() {
            if (!files.length) {
                els.selectAllFiles.checked = false;
                return;
            }
            els.selectAllFiles.checked = files.every((f) => f.selected);
        }

        function isImageFile(file) {
            if (!file) return false;
            if (file.type && file.type.startsWith('image/')) return true;
            return /\.(jpe?g|png|gif|webp|bmp|avif|heic)$/i.test(file.name || '');
        }

        async function addFiles(fileListLike) {
            const incoming = Array.from(fileListLike || []).filter(isImageFile);
            if (!incoming.length) {
                alert('未检测到图片文件，请选 JPG / PNG / WebP 等格式');
                return;
            }

            for (const file of incoming) {
                const thumbUrl = URL.createObjectURL(file);
                files.push({
                    id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                    file,
                    name: file.name,
                    thumbUrl,
                    caption: '',
                    selected: true
                });
            }

            if (files.length === incoming.length) previewIndex = 0;
            renderFileList();
            schedulePreview();
        }

        function clearAllFiles() {
            if (files.length && !confirm('清空全部图片？')) return;
            files.forEach((f) => URL.revokeObjectURL(f.thumbUrl));
            files = [];
            previewIndex = 0;
            revokePreviewUrl();
            const oldCanvas = document.getElementById('previewCanvas');
            if (oldCanvas) oldCanvas.remove();
            els.previewImage.hidden = true;
            els.previewEmpty.hidden = false;
            els.previewNav.hidden = true;
            els.previewFileName.textContent = '—';
            renderFileList();
        }

        function revokePreviewUrl() {
            if (previewObjectUrl) {
                URL.revokeObjectURL(previewObjectUrl);
                previewObjectUrl = null;
            }
        }

        function schedulePreview() {
            clearTimeout(previewTimer);
            previewTimer = setTimeout(renderPreview, 120);
        }

        function downscaleImageForPreview(img, maxSide) {
            const w = img.naturalWidth || img.width;
            const h = img.naturalHeight || img.height;
            if (!w || !h || Math.max(w, h) <= maxSide) return img;
            const scale = maxSide / Math.max(w, h);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(w * scale));
            canvas.height = Math.max(1, Math.round(h * scale));
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            return canvas;
        }

        function isPreviewCanvasCorrupt(canvas) {
            if (!canvas || !canvas.width || !canvas.height) return true;
            try {
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;
                const y0 = Math.floor(h * 0.55);
                const data = ctx.getImageData(Math.floor(w * 0.2), y0, Math.max(1, Math.floor(w * 0.6)), Math.max(1, Math.floor(h * 0.35))).data;
                let dark = 0;
                let total = 0;
                for (let i = 0; i < data.length; i += 16) {
                    if (data[i + 3] < 12) continue;
                    total += 1;
                    if (data[i] + data[i + 1] + data[i + 2] < 48) dark += 1;
                }
                return total > 24 && dark / total > 0.82;
            } catch (_) {
                return false;
            }
        }

        async function renderPreview() {
            const oldCanvas = document.getElementById('previewCanvas');
            if (oldCanvas) oldCanvas.remove();

            if (!files.length) {
                els.previewEmpty.hidden = false;
                els.previewImage.hidden = true;
                els.previewNav.hidden = true;
                els.previewFileName.textContent = '—';
                return;
            }

            previewIndex = Math.max(0, Math.min(previewIndex, files.length - 1));
            const item = files[previewIndex];
            els.previewEmpty.hidden = true;
            els.previewEmpty.textContent = '上传图片后在此预览加框效果';
            els.previewImage.hidden = true;
            els.previewNav.hidden = false;
            els.previewFileName.textContent = item.name;
            els.previewIndexLabel.textContent = `${previewIndex + 1} / ${files.length}`;
            els.prevPreviewBtn.disabled = previewIndex <= 0;
            els.nextPreviewBtn.disabled = previewIndex >= files.length - 1;
            if (els.rerenderPreviewBtn) els.rerenderPreviewBtn.disabled = true;

            try {
                const img = await loadImageFromFile(item.file);
                const source = downscaleImageForPreview(img, 1280);
                let canvas = StickerFrame.renderStickerFrame(
                    source,
                    readStyleOptions(item.caption, { forPreview: true })
                );
                if (isPreviewCanvasCorrupt(canvas)) {
                    await new Promise((r) => setTimeout(r, 40));
                    const smaller = downscaleImageForPreview(img, 720);
                    canvas = StickerFrame.renderStickerFrame(
                        smaller,
                        { ...readStyleOptions(item.caption, { forPreview: true }), previewMaxWidth: 720 }
                    );
                }
                revokePreviewUrl();

                const logicalW = canvas.width;
                const logicalH = canvas.height;
                const wrap = els.previewWrap;
                const maxW = Math.max(wrap.clientWidth - 12, 280);
                const maxH = Math.max(wrap.clientHeight - 12, 320);
                const scale = Math.min(maxW / logicalW, maxH / logicalH, 1);

                const previewCanvas = document.createElement('canvas');
                previewCanvas.id = 'previewCanvas';
                previewCanvas.width = canvas.width;
                previewCanvas.height = canvas.height;
                previewCanvas.style.width = `${logicalW * scale}px`;
                previewCanvas.style.height = `${logicalH * scale}px`;
                previewCanvas.getContext('2d').drawImage(canvas, 0, 0);
                els.previewWrap.appendChild(previewCanvas);

                if (isPreviewCanvasCorrupt(previewCanvas)) {
                    els.previewEmpty.hidden = false;
                    els.previewEmpty.textContent = '预览渲染异常（下半发黑）。请点「重新渲染」再试一次。';
                    previewCanvas.remove();
                }
            } catch (e) {
                console.error(e);
                els.previewEmpty.hidden = false;
                els.previewEmpty.textContent = '预览失败：' + e.message;
                els.previewImage.hidden = true;
            } finally {
                if (els.rerenderPreviewBtn) els.rerenderPreviewBtn.disabled = false;
            }
        }

        async function pickExportFolder() {
            if ('showDirectoryPicker' in window) {
                try {
                    exportDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    els.exportFolderPath.value = exportDirHandle.name;
                    localStorage.setItem(EXPORT_FOLDER_KEY, exportDirHandle.name);
                    updateExportButtonState();
                    return;
                } catch (e) {
                    if (e.name !== 'AbortError') alert('选择文件夹失败: ' + e.message);
                    return;
                }
            }
            els.exportFolderPath.focus();
            alert('当前浏览器不支持直接选文件夹，请粘贴完整路径（如 D:\\素材\\边框输出）');
        }

        function clearExportDirHandle() {
            exportDirHandle = null;
            updateExportButtonState();
        }

        async function saveBlobToPickedDir(dirHandle, filename, blob) {
            const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(blob);
            await writable.close();
        }

        async function nextNumberedPngSeqFromHandle(dirHandle) {
            let max = 0;
            for await (const [name, handle] of dirHandle.entries()) {
                if (handle.kind !== 'file') continue;
                const m = /^(\d+)\.png$/i.exec(name);
                if (m) max = Math.max(max, parseInt(m[1], 10));
            }
            return max + 1;
        }

        async function nextNumberedPngSeqFromPath(folderPath) {
            const res = await fetch(`/api/export-next-seq?folderPath=${encodeURIComponent(folderPath)}`);
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) throw new Error(data.error || '无法读取导出序号');
            return Number(data.nextSeq) || 1;
        }

        function formatNumberedPngName(seq) {
            return `${String(seq).padStart(3, '0')}.png`;
        }

        async function postExportImage(folderPath, name, data) {
            const res = await fetch('/api/export-image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ folderPath, name, data })
            });
            let result = {};
            try {
                result = await res.json();
            } catch (e) {
                throw new Error(res.status === 413
                    ? '单张图片过大，请用 Edge/Chrome 点「选择」直接写入文件夹'
                    : `服务器错误 (${res.status})，请重启 Node 服务后重试`);
            }
            if (!res.ok || !result.ok) {
                throw new Error(result.error || `导出失败 (${res.status})`);
            }
            return result;
        }

        async function exportAll() {
            const selected = files.filter((f) => f.selected);
            if (!selected.length) {
                alert('请至少选择一张图片');
                return;
            }
            const folderPath = els.exportFolderPath.value.trim();
            if (!exportDirHandle && !folderPath) {
                alert('请选择或填写导出文件夹');
                return;
            }

            els.exportBtn.disabled = true;
            els.exportProgress.classList.add('visible');

            try {
                const styleBase = readStyleOptions('', { forPreview: false });

                if (exportDirHandle) {
                    const perm = await exportDirHandle.requestPermission({ mode: 'readwrite' });
                    if (perm !== 'granted') throw new Error('没有文件夹写入权限，请重新选择');

                    let seq = await nextNumberedPngSeqFromHandle(exportDirHandle);
                    let done = 0;
                    for (const item of selected) {
                        done += 1;
                        els.exportProgress.textContent = `导出中 ${done}/${selected.length}…`;
                        const img = await loadImageFromFile(item.file);
                        const canvas = StickerFrame.renderStickerFrame(img, {
                            ...styleBase,
                            caption: item.caption
                        });
                        const blob = await StickerFrame.canvasToBlob(canvas);
                        const name = formatNumberedPngName(seq);
                        seq += 1;
                        await saveBlobToPickedDir(exportDirHandle, name, blob);
                    }
                    localStorage.setItem(EXPORT_FOLDER_KEY, exportDirHandle.name);
                    alert(`已导出 ${selected.length} 张到文件夹：${exportDirHandle.name}`);
                } else {
                    const saved = [];
                    let seq = await nextNumberedPngSeqFromPath(folderPath);
                    let i = 0;
                    for (const item of selected) {
                        i += 1;
                        els.exportProgress.textContent = `上传导出 ${i}/${selected.length}…`;
                        const img = await loadImageFromFile(item.file);
                        const canvas = StickerFrame.renderStickerFrame(img, {
                            ...styleBase,
                            caption: item.caption
                        });
                        const blob = await StickerFrame.canvasToBlob(canvas);
                        const data = await StickerFrame.blobToBase64(blob);
                        const name = formatNumberedPngName(seq);
                        seq += 1;
                        await postExportImage(folderPath, name, data);
                        saved.push(name);
                    }

                    localStorage.setItem(EXPORT_FOLDER_KEY, folderPath);
                    alert(`已导出 ${saved.length} 张到：\n${folderPath}`);
                }

                els.exportProgress.textContent = '导出完成';
            } catch (e) {
                alert('导出失败: ' + e.message);
                els.exportProgress.textContent = '';
            } finally {
                els.exportBtn.disabled = false;
                updateExportButtonState();
            }
        }

        function bindStyleControls() {
            const rerender = () => schedulePreview();

            els.presetSelect.addEventListener('change', () => {
                applyPresetToForm(els.presetSelect.value);
                schedulePreview();
            });

            [
                ['paddingRange', 'paddingVal'],
                ['borderRadiusRange', 'radiusVal'],
                ['shadowRange', 'shadowVal'],
                ['tiltRange', 'tiltVal']
            ].forEach(([rangeId, labelId]) => {
                els[rangeId].addEventListener('input', () => {
                    els[labelId].textContent = els[rangeId].value;
                    rerender();
                });
            });

            ['outputWidth', 'bgColor', 'tapeCheck', 'glassBgCheck'].forEach((id) => {
                els[id].addEventListener('change', () => {
                    if (id === 'glassBgCheck') syncSolidBgRowVisibility();
                    rerender();
                });
                els[id].addEventListener('input', rerender);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof StickerFrame === 'undefined') {
                alert('页面脚本加载失败，请强制刷新（Ctrl+F5）后重试');
                return;
            }

            applyPresetToForm('paper-collage');
            syncSolidBgRowVisibility();
            bindStyleControls();

            const savedFolder = localStorage.getItem(EXPORT_FOLDER_KEY);
            if (savedFolder) els.exportFolderPath.value = savedFolder;

            els.uploadDrop.addEventListener('click', () => els.fileInput.click());
            els.fileInput.addEventListener('change', (e) => {
                addFiles(e.target.files);
                els.fileInput.value = '';
            });

            els.uploadDrop.addEventListener('dragover', (e) => {
                e.preventDefault();
                els.uploadDrop.classList.add('dragover');
            });
            els.uploadDrop.addEventListener('dragleave', () => {
                els.uploadDrop.classList.remove('dragover');
            });
            els.uploadDrop.addEventListener('drop', (e) => {
                e.preventDefault();
                els.uploadDrop.classList.remove('dragover');
                addFiles(e.dataTransfer.files);
            });

            els.selectAllFiles.addEventListener('change', () => {
                files.forEach((f) => { f.selected = els.selectAllFiles.checked; });
                renderFileList();
            });

            els.clearAllBtn.addEventListener('click', clearAllFiles);
            els.prevPreviewBtn.addEventListener('click', () => {
                if (previewIndex > 0) {
                    previewIndex -= 1;
                    renderFileList();
                    schedulePreview();
                }
            });
            els.nextPreviewBtn.addEventListener('click', () => {
                if (previewIndex < files.length - 1) {
                    previewIndex += 1;
                    renderFileList();
                    schedulePreview();
                }
            });
            els.rerenderPreviewBtn.addEventListener('click', () => {
                renderPreview();
            });

            els.pickFolderBtn.addEventListener('click', pickExportFolder);
            els.exportFolderPath.addEventListener('input', clearExportDirHandle);
            els.exportBtn.addEventListener('click', exportAll);

            document.addEventListener('paste', (e) => {
                const items = e.clipboardData?.items;
                if (!items) return;
                const pasted = [];
                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        const file = item.getAsFile();
                        if (file) pasted.push(file);
                    }
                }
                if (pasted.length) {
                    e.preventDefault();
                    addFiles(pasted);
                }
            });

            window.addEventListener('resize', () => {
                if (files.length) schedulePreview();
            });
        });
    </script>
</body>
</html>
